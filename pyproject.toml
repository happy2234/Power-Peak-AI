[project]
name = "india-power-forecast"
version = "0.1.0"
description = "Daily-updating deep learning forecast of India's electricity demand (Grid-India PSP data)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "python-calamine>=0.2",  # fast .xls/.xlsx reader (pandas engine="calamine")
    "xlrd>=2.0",             # fallback reader for legacy .xls
    "openpyxl>=3.1",         # fallback reader for .xlsx
    "pdfplumber>=0.11",
    "requests>=2.31",
    "torch>=2.4",            # install the CUDA wheel: see README (GPU setup)
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "optuna>=3.6",
    "shap>=0.45",
    "holidays>=0.50",
    "plotly>=5.20",
    "streamlit>=1.35",
    "pyyaml>=6.0",
    "tabulate>=0.9",        # DataFrame.to_markdown for reports
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
